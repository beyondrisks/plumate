baseurl: ''
url: 'https://www.plumateco.com'  # Set to your custom domain: https://yourdomain.com
permalink: pretty
title: 'Plumate'
description: 'Your trusted source for quality products'

logo:
  mobile: "images/logo/logo_mobile1.png"
  mobile_height: "32px"
  mobile_width: "32px"
  desktop: "images/logo/logo1.png"
  desktop_height: "32px"
  desktop_width: "120px"

# Company contact details
contact:
  email: "info@example.com"
  phone: "(555) 123-4567"
  address: "123 Business Street, City, State 12345"

home:
  limit_services: 6

collections:
  services:
    output: true
    sort_by: weight
  team:
    output: true
  products:
    output: false
    sort_by: weight

defaults:
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "team"
  - scope:
      path: ""
      type: "products"
    values:
      layout: "product"

sass:
  style: compressed

plugins:
  - jekyll-environment-variables

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md

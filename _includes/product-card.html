<div class="product-card" data-category="{{ product.category }}" onclick="openProductModal(this)" style="cursor:pointer;"
  data-title="{{ product.title | escape }}"
  data-description="{{ product.description | escape }}"
  data-category-name="{{ product.category | escape }}"
  data-full-image="{{ product.image | relative_url }}">
  <div class="product-card-image">
    {% if product.thumbnail %}
      <img src="{{ product.thumbnail | relative_url }}" alt="{{ product.title }}" loading="lazy" />
    {% elsif product.image %}
      <img src="{{ product.image | relative_url }}" alt="{{ product.title }}" loading="lazy" />
    {% else %}
      <div class="product-placeholder-image">
        <span>{{ product.title | slice: 0 }}</span>
      </div>
    {% endif %}
  </div>
  <div class="product-card-content">
    <h3 class="product-card-title">{{ product.title }}</h3>
    {% if product.category %}
      <span class="product-card-category">{{ product.category }}</span>
    {% endif %}
  </div>
</div>
